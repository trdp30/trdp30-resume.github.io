<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trideep — NFC Card (Obsidian, SVG)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--s:5.1}            /* on-screen px per mm (vector SVG, scales cleanly) */
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  body{font-family:"Inter",system-ui,sans-serif;color:#eaf0ff;min-height:100vh;padding:34px 18px 60px;
    background:radial-gradient(60vmax 60vmax at 12% -10%,rgba(124,92,255,.12),transparent 60%),
      radial-gradient(55vmax 55vmax at 110% 4%,rgba(25,195,255,.12),transparent 60%),#05060c}
  .wrap{max-width:1040px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:26px}
  h1{font-weight:700;font-size:clamp(20px,3.4vw,27px)}
  h1 b{background:linear-gradient(120deg,#19c3ff,#7c5cff,#ff5c9d);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#9aa6c8;font-size:13px;margin-top:3px;max-width:62ch}
  .btn{font-weight:600;font-size:14px;color:#05070f;cursor:pointer;border:none;padding:11px 18px;border-radius:12px;
    background:linear-gradient(120deg,#19c3ff,#7c5cff);box-shadow:0 10px 26px rgba(25,195,255,.3)}
  .cards{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}
  .slot{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9aa6c8;font-weight:600}
  .card{width:calc(85.6*var(--s)*1px);height:calc(54*var(--s)*1px);border-radius:16px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .card img{width:100%;height:100%;display:block}
  @media (max-width:760px){ :root{--s:3.9} }
  @media (max-width:430px){ :root{--s:2.6} }
  @media print{
    @page{size:85.6mm 54mm;margin:0}
    body{background:#fff;padding:0}
    header,.tag{display:none!important}
    .cards{display:block}.slot{gap:0}
    .card{width:85.6mm;height:54mm;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NFC Card — <b>Obsidian</b> (SVG)</h1>
      <p>Dark, redefined: near-black with a single accent, a center tap-ripple marking the chip, and trimmed content — identity on the front, QR + three essentials on the back. Pure vector. Print / Save&nbsp;PDF for a true-size proof.</p>
    </div>
    <button class="btn" onclick="window.print()">⇩ Print / Save PDF</button>
  </header>
  <div class="cards">
    <div class="slot"><span class="tag">Front</span>
      <div class="card"><img src="design-3-obsidian-front.svg" alt="NFC card front"></div></div>
    <div class="slot"><span class="tag">Back</span>
      <div class="card"><img src="design-3-obsidian-back.svg" alt="NFC card back"></div></div>
  </div>
</div>
</body>
</html>
