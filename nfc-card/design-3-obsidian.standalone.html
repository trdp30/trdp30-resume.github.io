<style>
  *{box-sizing:border-box;margin:0;padding:0}

  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}

  .btn{font-weight:600;font-size:14px;color:#05070f;cursor:pointer;border:none;padding:10px 17px;border-radius:12px;

  .cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
  .slot{display:flex;flex-direction:column;align-items:center;gap:9px}
  .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9aa6c8;font-weight:600}
  .card{width:min(86vw,460px);aspect-ratio:856/540;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .card svg{width:100%;height:100%;display:block}
  @media print{
    @page{size:85.6mm 54mm;margin:0}
    body{background:#fff;padding:0} header,.tag{display:none!important}
    .cards{display:block}.slot{gap:0}
    .card{width:85.6mm;height:54mm;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
  }
