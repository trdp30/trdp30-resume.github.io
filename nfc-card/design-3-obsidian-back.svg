<svg xmlns="http://www.w3.org/2000/svg" width="85.6mm" height="54mm" viewBox="0 0 856 540" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c3ff"/><stop offset="0.55" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5c9d"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19c3ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.26"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect x="0" y="0" width="856" height="540" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect x="0" y="0" width="856" height="540" fill="#0a0b11"/>
    <circle cx="700" cy="60" r="280" fill="url(#glow)"/>
    <rect x="0" y="0" width="9" height="540" fill="url(#spine)"/>

    <!-- top row -->
    <text x="46" y="66" fill="#8591ad" font-size="15" font-weight="600" letter-spacing="3.5">TAP · SCAN · SAVE MY CONTACT</text>
    <text x="810" y="66" text-anchor="end" fill="#eef3ff" font-size="22" font-weight="700">Trideep Kumar Das</text>

    <!-- center: tap ripple -->
    <g transform="translate(258,250)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.4"/>
      <circle r="46" fill="none" stroke="#19c3ff" stroke-opacity="0.26" stroke-width="1.4"/>
      <circle r="31" fill="none" stroke="#7c5cff" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="3 5"/>
      <g fill="none" stroke="url(#acc)" stroke-width="3.4" stroke-linecap="round" transform="translate(-16,-16) scale(1.33)">
        <path d="M8.5 4.5a10 10 0 0 1 0 15"/><path d="M12.5 7a6 6 0 0 1 0 10"/><path d="M16.5 9.4a2.6 2.6 0 0 1 0 5.2"/>
      </g>
    </g>
    <text x="258" y="338" text-anchor="middle" fill="#cfe6ff" font-size="14" font-weight="600" letter-spacing="3">TAP PHONE</text>

    <line x1="408" y1="186" x2="408" y2="314" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>

    <!-- QR -->
    <rect x="474" y="172" width="156" height="156" rx="18" fill="#ffffff"/>
    <image x="487" y="185" width="130" height="130" href="data:image/png;base64," style="image-rendering:pixelated"/>
    <text x="552" y="352" text-anchor="middle" fill="#8591ad" font-size="14" font-weight="600" letter-spacing="3">SCAN</text>

    <!-- contacts -->
    <g font-size="19" font-weight="500" fill="#dfe7f7">
      <g transform="translate(46,424)">
        <g fill="none" stroke="#7fe3ff" stroke-width="1.8"><rect x="0" y="-11" width="22" height="16" rx="2.5"/><path d="M0 -9l11 7 11-7"/></g>
        <text x="34" y="3">trdp30@gmail.com</text>
      </g>
      <g transform="translate(46,456)">
        <path d="M2 -9a13 13 0 0 0 11 11l2.2-2.2 5 1.6v4a2 2 0 0 1-2 2A18 18 0 0 1 -1 -9a2 2 0 0 1 2-2h4l1.6 5z" fill="none" stroke="#7fe3ff" stroke-width="1.8"/>
        <text x="34" y="3">+91 97060 55724</text>
      </g>
      <g transform="translate(46,488)">
        <g fill="none" stroke="#7fe3ff" stroke-width="1.8"><circle cx="11" cy="-3" r="10"/><path d="M1 -3h20M11 -13a14 14 0 0 1 0 20M11 -13a14 14 0 0 0 0 20"/></g>
        <text x="34" y="3">profile.trideep.co.in</text>
      </g>
    </g>
  </g>
  <rect x="0.6" y="0.6" width="854.8" height="538.8" rx="33.4" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
